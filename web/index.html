<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patricia.wasm — UCI console</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --border: #262b38;
    --text: #d7dce6; --dim: #7c8598; --accent: #e05297; --green: #4ec97f;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 18px; }
  header h1 span { color: var(--accent); }
  #status { font-size: 13px; color: var(--dim); }
  #status b.ok { color: var(--green); }
  #status b.warn { color: #e0b052; }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 14px 20px; gap: 10px; }
  #log {
    flex: 1; overflow-y: auto; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-family: var(--mono); font-size: 12.5px;
    line-height: 1.5; white-space: pre-wrap; word-break: break-all;
  }
  #log .out { color: #8ab4f8; }
  #log .best { color: var(--green); font-weight: 600; }
  #log .err { color: #ef6a6a; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button, input[type=text] {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 12px; font-size: 13px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  #cmd { flex: 1; font-family: var(--mono); }
  #send { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>
<header>
  <h1>Patricia <span>.wasm</span> — UCI console</h1>
  <div id="status">loading…</div>
</header>
<main>
  <div class="row" id="quick">
    <button data-cmd="uci">uci</button>
    <button data-cmd="isready">isready</button>
    <button data-cmd="ucinewgame">ucinewgame</button>
    <button data-cmd="position startpos">position startpos</button>
    <button data-cmd="go depth 18">go depth 18</button>
    <button data-cmd="go movetime 3000">go movetime 3000</button>
    <button data-cmd="go infinite" id="btn-inf">go infinite</button>
    <button data-cmd="stop" id="btn-stop">stop</button>
    <button data-cmd="setoption name Skill_Level value 10">skill level 10</button>
    <button data-cmd="setoption name Skill_Level value 21">full strength</button>
  </div>
  <div id="log"></div>
  <form class="row" id="form">
    <input id="cmd" type="text" spellcheck="false"
           placeholder="Type any UCI command… e.g. position startpos moves e2e4 | go depth 15">
    <button id="send" type="submit">Send</button>
  </form>
</main>
<script>
  const logEl = document.getElementById("log");
  const statusEl = document.getElementById("status");
  const MAX_LINES = 2000;

  function log(text, cls) {
    const div = document.createElement("div");
    if (cls) div.className = cls;
    div.textContent = text;
    logEl.appendChild(div);
    while (logEl.childNodes.length > MAX_LINES) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }

  const threadedOK = self.crossOriginIsolated === true;
  const engineScript = threadedOK ? "pkg/patricia.js" : "pkg/patricia-single.js";
  statusEl.innerHTML = threadedOK
    ? 'build: <b class="ok">multithreaded (pthreads)</b> — crossOriginIsolated'
    : 'build: <b class="warn">single-threaded fallback</b> — page is not crossOriginIsolated (COOP/COEP headers missing); use explicit limits like "go depth N"';
  if (!threadedOK) {
    const inf = document.getElementById("btn-inf");
    inf.disabled = true;
    inf.title = "go infinite needs the multithreaded build (stop cannot interrupt a synchronous search)";
  }

  const worker = new Worker("uci-worker.js");
  let ready = false;
  const queue = [];

  worker.onmessage = (e) => {
    const m = e.data;
    if (m.type === "ready") {
      ready = true;
      log("[engine loaded: " + engineScript + "]", "best");
      queue.splice(0).forEach(send);
    } else if (m.type === "line") {
      log(m.line, m.line.startsWith("bestmove") ? "best" : undefined);
    } else if (m.type === "error") {
      log("[worker error] " + m.error, "err");
    }
  };
  worker.onerror = (e) => log("[worker error] " + e.message, "err");

  worker.postMessage({
    type: "init",
    scriptUrl: new URL(engineScript, location.href).href,
  });

  function send(cmd) {
    cmd = cmd.trim();
    if (!cmd) return;
    if (!ready) { queue.push(cmd); return; }
    log("> " + cmd, "out");
    worker.postMessage({ type: "cmd", cmd });
  }

  document.getElementById("quick").addEventListener("click", (e) => {
    const cmd = e.target.getAttribute && e.target.getAttribute("data-cmd");
    if (cmd) send(cmd);
  });

  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = document.getElementById("cmd");
    send(input.value);
    input.value = "";
  });

  // auto handshake on load
  send("uci");
  send("isready");
</script>
</body>
</html>
